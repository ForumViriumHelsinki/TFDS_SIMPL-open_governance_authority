      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

simpl_schema_manager_ui:
  enabled: true
  fullnameOverride: simpl-schema-manager-ui
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ==========================================
# CONSOLIDATED LEVEL 2 BUNDLE: authority-monitoring
# ==========================================
monitoring:
  enabled: true
  fullnameOverride: elastic
  resources:
    filebeat:
      requests:
        memory: "100Mi"
        cpu: "100m"
