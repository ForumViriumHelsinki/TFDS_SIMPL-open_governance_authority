singleNode: ${SINGLENODE}
authInitAutomation: ${AUTHINITAUTOMATION}

values:
  repo_URL: https://github.com/ForumViriumHelsinki/TFDS_SIMPL-open_governance_authority.git
  branch: ${BRANCH}

project: ${PROJECT}
domainSuffix: ${DOMAINSUFFIX}
namespaceTag:
  authority: ${AUTHNAMESPACETAG}
  common: ${COMMONSPACETAG}

organization:
  name: ${ORG_NAME}
  unit: ${ORG_UNIT}
  country: ${ORG_COUNTRY}

resourcePreset: default
# resourcePreset: low

argocd:
  appname: ${NAMESPACE}
  namespace: ${ARGOCDNAMESPACE}

cluster:
  address: https://kubernetes.default.svc
  namespace: ${NAMESPACE}
  commonToolsNamespace: ${COMMONNAMESPACE}
  issuer: ${CLUSTERISSUER}

secrets:
  role:  ${SECRETROLE}
  secretEngine: ${SECRETENGINE}

keycloak:
  repo_URL: 'https://charts.bitnami.com/bitnami'
  chart_name: keycloak
  targetRevision: 25.2.0
  keycloak_authenticator:
    targetRevision: 2.7.1
  eidas_demo_keycloak_extension:
    targetRevision: 0.4.2
  nameOverride: keycloak
  resourcesPreset: "none"
  resources:
    requests:
      cpu: "500m"
      memory: "1G"
    limits:
      cpu: "1"
      memory: "2G"
  valueFiles:
    - values.yaml

