{{- if .Values.authInitAutomation }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-init-script
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  init.sh: |
    #!/bin/sh
    set -e

    # ==============================================================================
    # INJECTED CONFIGURATION VARIABLES
    # ==============================================================================
    NAMESPACE="{{ .Values.cluster.namespace }}"
    TIER2_HOSTNAME="tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}"
    ORG_NAME="{{ .Values.organization.name }}"
    ORG_UNIT="{{ .Values.organization.unit }}"
    COUNTRY="{{ .Values.organization.country }}"
    PARTICIPANT_TYPE="GOVERNANCE_AUTHORITY"

    AUTHORITY_AUTH_PROVIDER="http://authentication-provider:8080"
    AUTHORITY_IDENTITY_PROVIDER="http://identity-provider:8080"
    CSR_FILE="/tmp/csr.json"
    CREDENTIAL_FILE="/tmp/credential.json"
    PAYLOAD_FILE="/tmp/final_payload.json"

    echo "========================================================"
    echo " Starting Simpl Identity Initialization (v2 API)"
    echo " Target Namespace:  $NAMESPACE"
    echo " Hostname (CN):     $TIER2_HOSTNAME"
    echo " Organization:      $ORG_NAME ($COUNTRY) - Unit: $ORG_UNIT"
    echo " Participant Type:  $PARTICIPANT_TYPE"
    echo "========================================================"

    # ==============================================================================
    # VALIDATION CHECK: ENSURE REQUIRED HELM VALUES ARE PROVIDED
    # ==============================================================================
    if [ -z "$ORG_NAME" ] || [ -z "$ORG_UNIT" ] || [ -z "$COUNTRY" ]; then
      echo "❌ ERROR: Missing required Organization configuration in Helm values!"
      echo "   Please ensure 'organization.name', 'organization.unit', and 'organization.country'"
      echo "   are properly defined in your values.yaml or ArgoCD manifest."
      echo "   Initialization aborted."
      exit 1
    fi

    # Wait for the backend Spring Boot APIs to come online
    echo "-> Waiting for Authentication and Identity APIs to become available..."
    MAX_RETRIES=60
    RETRY_COUNT=0

    # Query the Spring Boot /actuator/health endpoints to ensure the apps are fully booted and connected to the DB.
    # Since this runs at initial deployment, the timer has been set to 60 minutes, so the services can become healthy.
    until curl -s -o /dev/null -w "%{http_code}" "$AUTHORITY_AUTH_PROVIDER/actuator/health" | grep -q "200" && \
          curl -s -o /dev/null -w "%{http_code}" "$AUTHORITY_IDENTITY_PROVIDER/actuator/health" | grep -q "200"; do
      if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
        echo "❌ Timeout waiting for backend APIs to become healthy."
        exit 1
      fi
      echo "   Waiting 60s... ($RETRY_COUNT/$MAX_RETRIES)"
      sleep 60
      RETRY_COUNT=$((RETRY_COUNT+1))
    done
    echo "✅ APIs are healthy and reachable!"

    # ==============================================================================
    # IDEMPOTENCY CHECK: PREVENT OVERWRITING EXISTING IDENTITIES ON REBOOT/RESYNC
    # ==============================================================================
    echo "-> Checking if Governance Authority identity is already initialized..."
    # The safest way to check idempotency without OAuth2 tokens is to attempt
    # to create the GOVERNANCE_AUTHORITY participant.
    # The Identity Provider returns HTTP 409 Conflict ("Authority already initialized")
    # if the system was already fully bootstrapped.

    HTTP_STATUS=$(curl -s -o /tmp/id_response.txt -w "%{http_code}" -X POST "$AUTHORITY_IDENTITY_PROVIDER/tier1/v2/participants" \
      -H 'Content-Type: application/json' \
      -d "{
        \"organization\": \"$ORG_NAME\",
        \"participantType\": \"$PARTICIPANT_TYPE\",
        \"isAuthority\": true
      }")

    if grep -q "Authority already initialized" /tmp/id_response.txt || [ "$HTTP_STATUS" = "409" ]; then
      echo "   ✅ Found existing Governance Authority identity (HTTP 409). The data space is already initialized."
      echo "   Skipping initialization to preserve the existing identity and certificates."
      exit 0
    fi

    echo "   No existing Authority found. Proceeding with full PKI initialization..."

    # Extract participant ID from successful creation (HTTP 200/201)
    # Using awk instead of jq as the image is curlimages/curl based on alpine, but we will add jq to the image below.
    PARTICIPANT_ID=$(cat /tmp/id_response.txt | jq -r '.id')

    echo "   Active Participant ID: $PARTICIPANT_ID"

    # Execute PKI Workflow
    echo "-> 1. Creating Keypair..."
    KEYPAIR_RES=$(curl -s -f -X POST "$AUTHORITY_AUTH_PROVIDER/tier1/v2/keypairs" \
      -H 'Content-Type: application/json' \
      -d '{"name": "initialization-authority"}')
    KEYPAIR_ID=$(echo "$KEYPAIR_RES" | jq -r '.id')
    echo "   Keypair ID: $KEYPAIR_ID"

    echo "-> 2. Generating CSR..."
    curl -s -f -X POST "$AUTHORITY_AUTH_PROVIDER/tier1/v2/keypairs/$KEYPAIR_ID/csr" \
      -H 'Content-Type: application/json' \
      -d "{
        \"commonName\": \"$TIER2_HOSTNAME\",
        \"country\": \"$COUNTRY\",
        \"organization\": \"$ORG_NAME\",
        \"organizationalUnit\": \"$ORG_UNIT\"
      }" > "$CSR_FILE"

    echo "-> 3. Uploading CSR to Identity Provider..."
    curl -s -f -X PUT "$AUTHORITY_IDENTITY_PROVIDER/tier1/v2/participants/$PARTICIPANT_ID/csr" \
      -H 'Content-Type: application/json' \
      -d @"$CSR_FILE" > /dev/null

    echo "-> 4. Creating Credentials..."
    curl -s -f -X POST "$AUTHORITY_IDENTITY_PROVIDER/tier1/v2/participants/$PARTICIPANT_ID/credentials" \
      -H 'Content-Type: application/json' \
      -d '{"reason": "INITIALIZATION_REASON"}' > "$CREDENTIAL_FILE"

    # Extract credential content block from response
    CRED_B64=$(jq -r '.content' "$CREDENTIAL_FILE")

    echo "-> 5. Uploading Credentials to Authentication Provider..."
    # Use jq to safely construct the JSON payload to avoid multiline string breakage
    jq -n --arg content "$CRED_B64" '{"reason": "initialization-authority", "content": $content}' > "$PAYLOAD_FILE"

    curl -s -f -X POST "$AUTHORITY_AUTH_PROVIDER/tier1/v2/credentials" \
      -H 'Content-Type: application/json' \
      -d @"$PAYLOAD_FILE" > /dev/null

    rm "$PAYLOAD_FILE"

    echo ""
    echo "========================================================"
    echo " 🎉 FRESH INITIALIZATION COMPLETE!"
    echo " The Governance Authority identity has been generated."
    echo "========================================================"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-init-job
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      name: agent-init-job
    spec:
      containers:
        - name: init-runner
          image: curlimages/curl:8.7.1
          # Add jq to the container before running the script
          command: ["/bin/sh", "-c", "apk add --no-cache jq && /scripts/init.sh"]
          volumeMounts:
            - name: script-volume
              mountPath: "/scripts"
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: script-volume
          configMap:
            name: agent-init-script
            defaultMode: 0555
{{- end }}
