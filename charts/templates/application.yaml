{{- $authorities := .Values.agentList.authorities | default (list) }}
{{- $providers := .Values.agentList.providers | default (list) }}
{{- $consumers := .Values.agentList.consumers | default (list) }}
{{- $namespace := .Values.cluster.namespace | default "" }}

{{- /* Define HA overrides based on Resource Preset */ -}}
{{- $keycloakHA := .Values.keycloak.ha }}
{{- $redisHA := false }} {{/* Redis is handled slightly differently in GA, but let's default to false in low */}}

{{- if eq .Values.resourcePreset "low" }}
{{- $keycloakHA = false }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.appname }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  syncPolicy:
    automated: {}
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: {{ .Values.cluster.namespace }}
  sources:
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    ref: values


  {{- if .Values.sap.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/security-attributes-provider
    helm:
      values: |
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        env: 
          - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
            value: "DEBUG"
          - name: SPRING_JPA_SHOW_SQL
            value: "false"
          - name: SPRING_DATASOURCE_PASSWORD
            value: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-securityattributesprovider
          - name: SPRING_DATA_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-secrets
                key: redis
        microservices:
          identityProviderUrl: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          onboardingUrl: http://onboarding.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        appConfig:
          spring: 
            data:
              redis:
                host: redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local
            datasource:
              url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_securityattributesprovider"
              username: {{ .Values.namespaceTag.authority }}_securityattributesprovider 
              {{- with .Values.backendExtraGlobalDatasource }}
              {{ . | nindent 14 }}
              {{- end }}
          simpl:
            ephemeral-proof:
              issuer-url: tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          otlp:
            tracing:
              endpoint: http://collector.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.sap.resources }}
        resources: {{- toYaml .Values.sap.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.redis_commander.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.redis_commander.projectID }}/packages/helm/stable"
    targetRevision: {{ .Values.redis_commander.targetRevision }}
    chart: {{ .Values.redis_commander.chart_name }}
    helm:
      values: |
        redis:
          host: {{ .Values.redis.nameOverride }}-{{ .Values.cluster.namespace }}-master
  {{- end }}

  {{- /* ======================================== */ -}}
  {{- /* MONOREPO MICROSERVICES (FROM IAA BUNDLE) */ -}}
  {{- /* ======================================== */ -}}
  
  {{- if .Values.keycloak.enabled }}
  - repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 22.2.5
    chart: keycloak
    helm:
      values: |
        global:
          security:
            allowInsecureImages: true
        image:
          repository: keycloak/keycloak
          tag: 26.4
        fullnameOverride: keycloak-{{ .Values.cluster.namespace }}
        defaultInitContainers:
          prepareWriteDirs:
            enabled: false
        command:
          - /opt/keycloak/bin/kc.sh
        args:
          - start
          - --log-level=DEBUG
          - --import-realm
          - --verbose
          - --proxy-headers
          - xforwarded
        containerSecurityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        apiUrl: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}"
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        auth:
          adminPassword: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        externalDatabase:
          host: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
          database: {{ .Values.namespaceTag.authority }}_keycloak
          user: {{ .Values.namespaceTag.authority }}_keycloak
          password: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak"
        extraEnvVars:
        - name: KC_HOSTNAME_ADMIN
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: KC_HOSTNAME
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: USERS_ROLES_BASE_URL
          value: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/tier1/v2"
        - name: KEYCLOAK_BASE_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: AUTHENTICATION_PROVIDER_BASE_URL
          value: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/tier1/v2"
        - name: REALM
          value: "authority"
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL_HOST
          value: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: {{ .Values.namespaceTag.authority }}_keycloak
        - name: KC_DB_USERNAME
          value: {{ .Values.namespaceTag.authority }}_keycloak
        - name: KC_DB_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        extraVolumes:
          - name: spi-volume
            configMap:
              name: keycloak-spi-configmap
        extraVolumeMounts:
          - name: spi-volume
            mountPath: /opt/keycloak/providers/
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
          ingressClassName: nginx
          tls:
            - secretName: keycloak-{{ .Values.cluster.namespace }}-tls
              hosts:
                - authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          hostname: authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          pathType: Prefix
          extraPaths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: keycloak-{{ .Values.cluster.namespace }}
                  port:
                    number: 80
        {{- if eq $keycloakHA false }}
        replicaCount: 1
        affinity: {}
        {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.keycloak.resources }}
        resources: {{- toYaml .Values.keycloak.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.auth_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/authentication-provider
    helm:
      values: |
        config:
          agentType: authority
          identifierNumber: {{ .Values.identifierNumber }}
        appConfig:
          management:
            otlp:
              tracing:
                endpoint: http://collector.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}
          spring:
            datasource:
              url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_authenticationprovider"
              username: {{ .Values.namespaceTag.authority }}_authenticationprovider
              {{- with .Values.backendExtraGlobalDatasource }}
              {{ . | nindent 14 }}
              {{- end }}
            data:
              redis:
                host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
          microservice:
            identity-provider:
              url: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
            security-attributes-provider:
              url: http://security-attributes-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          client:
            authority:
              url: "https://tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}"
          simpl:
            certificate:
              san: "tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}"
          openid-connect:
            certsEndpoint: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth/realms/authority/protocol/openid-connect/certs"
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: KAFKA_AUTHPROVIDER
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_authprovider"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        - name: SPRING_DATASOURCE_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-authenticationprovider"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              producer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_authprovider" password="${KAFKA_AUTHPROVIDER}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.auth_provider.resources }}
        resources: {{- toYaml .Values.auth_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.identity_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/identity-provider
    helm:
      values: |
        config:
          authProviderInternalUrl: http://authentication-provider-{{ .Values.cluster.namespace }}.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        env: 
          - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
            value: "DEBUG"
          - name: SPRING_JPA_SHOW_SQL
            value: "false"
          - name: SPRING_DATASOURCE_PASSWORD
            value: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-identityprovider
          - name: SPRING_SSL_BUNDLE_JKS_EJBCA_KEYSTORE_PASSWORD
            value: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-ejbca#keystorepass
          - name: SPRING_DATA_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-secrets
                key: redis
        appConfig:
          ejbca:
            url: "https://ejbca-community-helm.{{ .Values.cluster.namespace }}.svc.cluster.local:30443"
          spring:
            datasource:
              url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_identityprovider"
              username: {{ .Values.namespaceTag.authority }}_identityprovider
              {{- with .Values.backendExtraGlobalDatasource }}
              {{ . | nindent 14 }}
              {{- end }}
          management:
            otlp:
              tracing:
                endpoint: http://collector.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.identity_provider.resources }}
        resources: {{- toYaml .Values.identity_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.tier1_gateway.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/tier1-gateway
    helm:
      values: |
        hostT1: authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        usersRolesUrl: http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        securityAttributesProviderUrl: http://security-attributes-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        keycloakUrl: http://keycloak.{{ .Values.cluster.namespace }}.svc.cluster.local
        onboardingUrl: http://onboarding.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        ejbcaUrl: http://ejbca-community-helm.{{ .Values.cluster.namespace }}.svc.cluster.local:30080
        identityProviderUrl: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        appConfig:
          external-routes:
            spring-route-definitions:
              - id: fc-service
                uri: "http://xsfc-service:8081"
                predicates:
                - Path=/fc/**
                filters:
                - StripPrefix=1
              - id: schema-manager
                uri: "http://schema-manager-service:8085"
                predicates:
                - Path=/schema-manager/**
                filters:
                - StripPrefix=1
              {{- if .Values.development.enableTestConfigurations }}
              - id: postgrest-authenticationprovider
                uri: "http://postgrest-authenticationprovider.{{ .Release.Namespace }}.svc.cluster.local:3000"
                predicates:
                  - Path=/postgrest/authenticationprovider/**
                filters:
                  - StripPrefix=2
              - id: postgrest-identityprovider
                uri: "http://postgrest-identityprovider.{{ .Release.Namespace }}.svc.cluster.local:3000"
                predicates:
                  - Path=/postgrest/identityprovider/**
                filters:
                  - StripPrefix=2
              - id: postgrest-onboarding
                uri: "http://postgrest-onboarding.{{ .Release.Namespace }}.svc.cluster.local:3000"
                predicates:
                  - Path=/postgrest/onboarding/**
                filters:
                  - StripPrefix=2
              - id: postgrest-securityattributesprovider
                uri: "http://postgrest-securityattributesprovider.{{ .Release.Namespace }}.svc.cluster.local:3000"
                predicates:
                  - Path=/postgrest/securityattributesprovider/**
                filters:
                  - StripPrefix=2
              - id: postgrest-usersroles
                uri: "http://postgrest-usersroles.{{ .Release.Namespace }}.svc.cluster.local:3000"
                predicates:
                  - Path=/postgrest/usersroles/**
                filters:
                  - StripPrefix=2
              - id: users-roles-test-cli
                uri: ${users-roles.url}
                predicates:
                  - Path=
                    /cli/userApi/v1/users,
                    /cli/userApi/v1/users/*,
                    /cli/userApi/v1/roles,
                    /cli/userApi/v1/roles/*,
                filters:
                  - StripPrefix=2
                  - name: ClientCredentialsFilterFactory
                    args:
                      cli: cli-

              - id: cleanup-users-with-CLI-v2
                uri: ${users-roles.url}
                predicates:
                  - Path=
                    /cli/userApi/tier1/v2/users,
                    /cli/userApi/tier1/v2/users/*,
                    /cli/userApi/tier1/v2/roles,
                    /cli/userApi/tier1/v2/roles/*,
                filters:
                  - StripPrefix=2
                  - name: ClientCredentialsFilterFactory
                    args:
                      cli: cli-role
              - id: authenticationprovider-internal
                uri: ${authentication-provider.url}
                predicates:
                  - Path=/internal/authApi/**
                filters:
                  - StripPrefix=2
              - id: identityprovider-internal
                uri: ${identity-provider.url}
                predicates:
                  - Path=/internal/identityApi/**
                filters:
                  - StripPrefix=2
              {{- end }}
            public-urls:
              - path: "/schema-manager/**"
              {{- if .Values.development.enableTestConfigurations }}
              - path: "/postgrest/**"
              - path: "/internal/**"
              {{- end }}
          jwt-configuration:
            primary:
              realm: authority
            applicant:
              realm: onboarding
          microservices-info:
            microservices:
            - name: users-roles
              internalUrl: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
              detailUrl: "https://authority.be.{{ .Values.cluster.namespace }}.{{ .Values.domainSuffix }}/userApi/v1/"
            - name: sap
              internalUrl: "http://security-attributes-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
              detailUrl: "https://authority.be.{{ .Values.cluster.namespace }}.{{ .Values.domainSuffix }}/sapApi/v1/"
            - name: identity-provider
              internalUrl: "http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
              detailUrl: "https://authority.be.{{ .Values.cluster.namespace }}.{{ .Values.domainSuffix }}/identityApi/v1/"
            - name: onboarding
              internalUrl: "http://onboarding.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
              detailUrl: "https://authority.be.{{ .Values.cluster.namespace }}.{{ .Values.domainSuffix }}/onboardingApi/v1/"
            - name: authentication-provider
              internalUrl: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/v1"
              detailUrl: "https://authority.be.{{ .Values.cluster.namespace}}.{{ .Values.domainSuffix }}/authApi/v1/"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier1_gateway.resources }}
        resources: {{- toYaml .Values.tier1_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.tier2_gateway.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/tier2-gateway
    helm:
      values: |
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: KAFKA_TIER2GW
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_tier2gw"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        global:
          cors:
            allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        microservices:
          usersRolesUrl: http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          keycloakUrl: http://keycloak.{{ .Values.cluster.namespace }}.svc.cluster.local
          securityAttributesProviderUrl: http://security-attributes-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          identityProviderUrl: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        redis:
          host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
        hostT2: tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              consumer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_tier2gw" password="${KAFKA_TIER2GW}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            nginx.ingress.kubernetes.io/proxy-body-size: "100m"
          hosts:
            - host: tier2.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: tier2-gateway-tls
              hosts:
                - tier2.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_gateway.resources }}
        resources: {{- toYaml .Values.tier2_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.fe_users_roles.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/fe-users-and-roles
    helm:
      values: |
        hostFe: authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1"
        - name: KEYCLOAK_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: KEYCLOAK_REALM
          value: "authority" 
        - name: KEYCLOAK_CLIENT_ID
          value: "frontend-cli"
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
