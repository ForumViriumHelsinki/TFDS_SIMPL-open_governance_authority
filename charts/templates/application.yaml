{{- $authorities := .Values.agentList.authorities | default (list) }}
{{- $providers := .Values.agentList.providers | default (list) }}
{{- $consumers := .Values.agentList.consumers | default (list) }}
{{- $namespace := .Values.cluster.namespace | default "" }}

{{- /* Define HA overrides based on Resource Preset */ -}}
{{- $keycloakHA := .Values.keycloak.ha }}
{{- $redisHA := false }} {{/* Redis is handled slightly differently in GA, but let's default to false in low */}}

{{- if eq .Values.resourcePreset "low" }}
{{- $keycloakHA = false }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.appname }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  syncPolicy:
    automated: {}
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: {{ .Values.cluster.namespace }}
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values


  {{- if .Values.sap.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/security-attributes-provider
    helm:
      values: |
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.sap.resources }}
        resources: {{- toYaml .Values.sap.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.redis_commander.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.redis_commander.projectID }}/packages/helm/stable"
    targetRevision: {{ .Values.redis_commander.targetRevision }}
    chart: {{ .Values.redis_commander.chart_name }}
    helm:
      values: |
        redis:
          host: {{ .Values.redis.nameOverride }}-{{ .Values.cluster.namespace }}-master
  {{- end }}

  {{- /* ======================================== */ -}}
  {{- /* MONOREPO MICROSERVICES (FROM IAA BUNDLE) */ -}}
  {{- /* ======================================== */ -}}
  
  {{- if .Values.keycloak.enabled }}
  - repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 22.2.5
    chart: keycloak
    helm:
      values: |
        global:
          security:
            allowInsecureImages: true
        image:
          repository: keycloak/keycloak
          tag: 26.4
        fullnameOverride: keycloak-{{ .Values.cluster.namespace }}
        defaultInitContainers:
          prepareWriteDirs:
            enabled: false
        command:
          - /opt/keycloak/bin/kc.sh
        args:
          - start
          - --log-level=DEBUG
          - --import-realm
          - --verbose
          - --proxy-headers
          - xforwarded
        containerSecurityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        apiUrl: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}"
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        auth:
          adminPassword: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        externalDatabase:
          host: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
          database: {{ .Values.namespaceTag.authority }}_keycloak
          user: {{ .Values.namespaceTag.authority }}_keycloak
          password: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak"
        extraEnvVars:
        - name: KC_HOSTNAME_ADMIN
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: KC_HOSTNAME
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: USERS_ROLES_BASE_URL
          value: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/tier1/v2"
        - name: KEYCLOAK_BASE_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/auth"
        - name: AUTHENTICATION_PROVIDER_BASE_URL
          value: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/tier1/v2"
        - name: REALM
          value: "authority"
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL_HOST
          value: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: {{ .Values.namespaceTag.authority }}_keycloak
        - name: KC_DB_USERNAME
          value: {{ .Values.namespaceTag.authority }}_keycloak
        - name: KC_DB_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        extraVolumes:
          - name: spi-volume
            configMap:
              name: keycloak-spi-configmap
        extraVolumeMounts:
          - name: spi-volume
            mountPath: /opt/keycloak/providers/
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
          ingressClassName: nginx
          tls:
            - secretName: keycloak-{{ .Values.cluster.namespace }}-tls
              hosts:
                - authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          hostname: authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          pathType: Prefix
          extraPaths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: keycloak-{{ .Values.cluster.namespace }}
                  port:
                    number: 80
        {{- if eq $keycloakHA false }}
        replicaCount: 1
        affinity: {}
        {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.keycloak.resources }}
        resources: {{- toYaml .Values.keycloak.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- if .Values.auth_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/authentication-provider
    helm:
      values: |
        config:
          agentType: authority
          identifierNumber: {{ .Values.identifierNumber }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.auth_provider.resources }}
        resources: {{- toYaml .Values.auth_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.identity_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/identity-provider
    helm:
      values: |
        config:
          authProviderInternalUrl: http://authentication-provider-{{ .Values.cluster.namespace }}.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.identity_provider.resources }}
        resources: {{- toYaml .Values.identity_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.tier1_gateway.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/tier1-gateway
    helm:
      values: |
        config:
          backend:
            http:
              provider: http://authentication-provider-{{ .Values.cluster.namespace }}.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            hosts:
              - host: auth.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: {{ .Values.tier1_gateway.ingress.secretName }}-tls
                hosts:
                  - auth.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier1_gateway.resources }}
        resources: {{- toYaml .Values.tier1_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.tier2_gateway.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/tier2-gateway
    helm:
      values: |
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
            nginx.ingress.kubernetes.io/proxy-body-size: "100m"
          hosts:
            - host: tier2.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: {{ .Values.tier2_gateway.ingress.secretName }}-tls
              hosts:
                - tier2.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_gateway.resources }}
        resources: {{- toYaml .Values.tier2_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.security_attributes_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/security-attributes-provider
    helm:
      values: |
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.security_attributes_provider.resources }}
        resources: {{- toYaml .Values.security_attributes_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}


  {{- if .Values.fe_users_roles.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/fe-users-and-roles
    helm:
      values: |
        hostFe: authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1"
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.fe_users_roles.resources }}
        resources: {{- toYaml .Values.fe_users_roles.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.fe_identity_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/fe-identity-provider
    helm:
      values: |
        hostFe: authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1"
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.fe_identity_provider.resources }}
        resources: {{- toYaml .Values.fe_identity_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.fe_onboarding.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/fe-onboarding
    helm:
      values: |
        hostFe: authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1"
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.fe_onboarding.resources }}
        resources: {{- toYaml .Values.fe_onboarding.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.fe_security_attribute_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/fe-security-attribute-provider
    helm:
      values: |
        hostFe: authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1"
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.fe_security_attribute_provider.resources }}
        resources: {{- toYaml .Values.fe_security_attribute_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.fe_auth_provider.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/fe-authentication-provider
    helm:
      values: |
        hostFe: authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1"
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.fe_auth_provider.resources }}
        resources: {{- toYaml .Values.fe_auth_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.onboarding.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/onboarding
    helm:
      values: |
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.onboarding.resources }}
        resources: {{- toYaml .Values.onboarding.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.tier2_proxy.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/tier2-proxy
    helm:
      values: |
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_proxy.resources }}
        resources: {{- toYaml .Values.tier2_proxy.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- if .Values.users_roles.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/users-roles
    helm:
      values: |
        config:
          app:
            namespaceTag: {{ .Values.namespaceTag.authority }}
            domainSuffix: {{ .Values.domainSuffix }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.users_roles.resources }}
        resources: {{- toYaml .Values.users_roles.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- /* ======================================== */ -}}
  {{- /* MONOREPO MICROSERVICES (FROM EDC BUNDLE) */ -}}
  {{- /* ======================================== */ -}}

  {{- if .Values.simpl_schema_manager.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/simpl-schema-manager-charts
    helm:
      values: |
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_schema_manager.resources }}
        resources: {{- toYaml .Values.simpl_schema_manager.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}

        {{- end }}
  {{- end }}

        {{- end }}
  {{- end }}

  {{- /* ======================================== */ -}}

  {{- /* ======================================== */ -}}
  {{- /* MONOREPO MICROSERVICES (FROM MONITORING) */ -}}
  {{- /* ======================================== */ -}}

  {{- if .Values.monitoring.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/eck-monitoring
    helm:
      values: |
        agentType: authority
        clusterIssuer: {{ .Values.cluster.issuer }}
        clusterIssuer_internal: {{ .Values.cluster.internalIssuer }}
        domainSuffix: {{ .Values.domainSuffix }}
        namespaceTag: {{ .Values.namespaceTag.authority }}
        mainNamespace: {{ .Values.namespaceTag.authority }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- end }}
  {{- end }}


  {{- if .Values.xsfc_catalogue.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/xfsc-advsearch
    helm:
      values: |
        global:
          tls:
            - secretName: xsfc-server-tls
              hosts:
                - xsfc-server-service.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          annotations: 
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
        hashicorp:
          service: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          role: {{ .Values.secrets.role }}
          secretEngine: /v1/{{ .Values.secrets.secretEngine }}/data
        secretConfigPath: "/v1/{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-xsfc-service"  
        ingress:
          enabled: false
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        neo4j:
          neo4j:
            resources:
              cpu: "500m"
        {{- else }}
          {{- if .Values.xsfc_catalogue.resources }}
        resources: {{- toYaml .Values.xsfc_catalogue.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}         

  {{- if .Values.adapter.enabled }}                    
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/edc-connector-adapter
    helm:
      releaseName: {{ .Values.adapter.fullnameOverride }}
      values: |
        ingress:
          enabled: false
        hashicorp:
          service: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          role: {{ .Values.secrets.role }}
          secretEngine: /v1/{{ .Values.secrets.secretEngine }}/data
        secretConfigPath: "/v1/{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-adapter-simpl-backend"   
  {{- end }}        

  {{- if .Values.simpl_schema_manager_ui.enabled }}
  - repoURL: {{ .Values.monorepo_URL }}
    targetRevision: {{ .Values.monorepo_branch }}
    path: charts/schema-manager-ui
    helm:
      releaseName: {{ .Values.simpl_schema_manager_ui.fullnameOverride }}
      values: |
        ingress:
          hosts:
          - host: schema-manager-fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
            paths:
              - path: /
                pathType: ImplementationSpecific
          tls:
          - secretName: schema-manager-fe-tls
            hosts:
              - schema-manager-fe.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
        env:
          PUBLIC_AUTH_KEYCLOAK_SERVER_URL: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}"
          PUBLIC_AUTH_KEYCLOAK_REALM: 'authority'
          PUBLIC_AUTH_KEYCLOAK_CLIENT_ID: 'frontend-cli'
          PUBLIC_SCHEMA_MANAGER_API_URL: 'https://schema-manager-be.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}/v1'
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.simpl_schema_manager_ui.resources }}
        resources: {{- toYaml .Values.simpl_schema_manager_ui.resources| nindent 12 }}
          {{- end }}
        {{- end }}
  {{- end }}

  {{- /* EXTERNAL THIRD-PARTY DEPENDENCIES        */ -}}
  {{- /* ======================================== */ -}}

  {{- if .Values.redis.enabled }}
  - repoURL: {{ .Values.redis.repo_URL }}
    targetRevision: {{ .Values.redis.targetRevision }}
    chart: {{ .Values.redis.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.redis.valueFiles }}
        - $values/app-values/redis/{{ . }}
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.redis.nameOverride }}-{{ .Values.cluster.namespace }}
        {{- if eq $redisHA false }}
        architecture: standalone
        {{- end }}
  {{- end }}

  {{- if .Values.ejbca.enabled }}
  - repoURL: {{ .Values.ejbca.repo_URL }}
    targetRevision: {{ .Values.ejbca.targetRevision }}
    chart: {{ .Values.ejbca.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.ejbca.valueFiles }}
        - $values/app-values/ejbca/{{ . }}
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        fullnameOverride: {{ .Values.ejbca.fullnameOverride }}
        hostname: &hostname ejbca-community-helm.{{ .Values.cluster.namespace }}.svc.cluster.local
        ejbca:
          env:
            HTTPSERVER_HOSTNAME: *hostname
            DATABASE_JDBC_URL: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_ejbca"
            DATABASE_USER: {{ .Values.cluster.namespace }}_ejbca
            DATABASE_PASSWORD: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-ejbca
          initContainers:
          - name: ejbca-init
            image: code.europa.eu:4567/simpl/simpl-open/development/iaa/ejbca-preconfig:1.0.3
            imagePullPolicy: IfNotPresent
        ingress:
          hosts:
            - host: ejbca.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
              paths:
              - path: /
                pathType: Prefix
          tls:
            - secretName: ejbca-tls-{{ .Values.cluster.namespace }}
              hosts:
                - ejbca.{{ .Values.namespaceTag.authority }}.{{ .Values.domainSuffix }}
          annotations:
            cert-manager.io/cluster-issuer: {{ .Values.cluster.issuer }}
  {{- end }}

